name: Autonomous Agent Repair

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      task:
        description: "Task for the coding agent"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ai-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - name: Build task
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          MANUAL_TASK: ${{ inputs.task }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          task = os.environ.get("MANUAL_TASK") or ("Resolve GitHub issue: " + os.environ.get("ISSUE_TITLE","") + "\n\n" + os.environ.get("ISSUE_BODY",""))
          Path("/tmp/agent-task.txt").write_text(task)
          PY

      - name: Run autonomous agent
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL || 'https://api.openai.com/v1' }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_MAX_ITERATIONS: "25"
          AI_MAX_TOOL_CALLS: "160"
          AGENT_COMMAND_POLICY: strict
        run: npm start -- "$(cat /tmp/agent-task.txt)"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Agent made no changes."
            exit 0
          fi
          BRANCH="ai-agent/run-${{ github.run_id }}"
          git config user.name "ai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "fix: autonomous agent repair"
          git push --set-upstream origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "AI Agent: autonomous repair" --body "Generated by the autonomous coding agent. CI must pass before merge."
